[project]
name = "skillmatch"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.12.1",
    "Django==5.2.18",
    "psycopg[binary]==3.2.10",
    "sqlparse==0.6.0",
    "tzdata==2026.5",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python vercel_build.py"
